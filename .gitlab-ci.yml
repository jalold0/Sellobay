# GitLab CI — .github/workflows/ci.yml va docker.yml ekvivalenti.
# Eslatma: sayt Vercel'da deploy bo'ladi, shu sababli bu yerda deploy job yo'q.

stages:
  - verify
  - deploy
  - docker

# Pipeline QACHON ishga tushadi.
#
# Ilgari bu yerda faqat main/develop va MR turardi — ya'ni feature branch'ga
# push qilgan dasturchi MR ochmaguncha CI'dan hech qanday signal olmasdi.
# Xato faqat MR ochilganda ko'rinardi. Endi har qanday branch tekshiriladi.
#
# Ikkinchi qoida dublikatning oldini oladi: branch'da ochiq MR bo'lsa, GitLab
# aks holda ikkita pipeline (branch + MR) ishga tushirardi va CI daqiqalari
# ikki barobar sarflanardi.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH

variables:
  # Prisma client generatsiyasi va Next build vaqtidagi schema validatsiyasi uchun
  # placeholder (CI'da haqiqiy DB'ga ulanilmaydi)
  DATABASE_URL: 'postgresql://user:pass@localhost:5432/db'
  PNPM_STORE: '$CI_PROJECT_DIR/.pnpm-store'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Node ishlatadigan har ikki job uchun umumiy tayyorgarlik.
#
# `apt-get install openssl` NEGA KERAK: Prisma query engine'i libssl'ga bog'liq,
# `node:20-bookworm-slim` esa openssl paketisiz keladi. Bo'lmasa Prisma versiyani
# ANIQLAY OLMAYDI va jim ravishda "openssl-1.1.x" ga qaytadi, keyin engine .so
# faylini yuklashda yiqiladi (bookworm'da OpenSSL 3.x, libssl.so.1.1 yo'q).
#
# Bu nuqson boshidan bor edi, lekin JIM edi: lint/typecheck/build Prisma engine'ini
# hech qachon yuklamaydi, shuning uchun ogohlantirish faqat log'da qolardi. Uni
# birinchi bo'lib apps/web testlari ochib berdi (engine'ni haqiqatan ko'targan
# yagona qadam). migrate-deploy job'i ham xuddi shu obrazda ishlaydi, ya'ni
# migratsiya ham shu xato bilan yiqilardi.
#
# `pnpm install`dan OLDIN turishi SHART: engine binari postinstall'da yuklab
# olinadi, ya'ni aniqlash aynan o'sha paytda to'g'ri bo'lishi kerak.
.node-setup: &node-setup
  - apt-get update -y
  - apt-get install -y --no-install-recommends openssl ca-certificates
  - rm -rf /var/lib/apt/lists/*
  - corepack enable
  - corepack prepare pnpm@9.15.9 --activate
  - pnpm config set store-dir "$PNPM_STORE"
  - pnpm install --frozen-lockfile

lint-typecheck-build:
  stage: verify
  image: node:20-bookworm-slim
  # GitHub'dagi `concurrency: cancel-in-progress` ekvivalenti
  interruptible: true
  # `rules` yozilmasa job MR pipeline'ida ishga tushmaydi (default only: branches, tags).
  # Qaysi pipeline umuman ochilishi yuqoridagi workflow:rules bilan hal qilinadi —
  # bu yerda shu ro'yxatni takrorlaymiz, aks holda job branch pipeline'ida tushib qolardi.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script: *node-setup
  script:
    # Prisma client typecheck va build uchun kerak (DB'ga ulanmaydi)
    - pnpm db:generate
    - pnpm lint
    - pnpm typecheck
    # Unit-testlar — `test` skripti bor HAR BIR paket.
    # Ilgari bu yerda faqat @ecom/core-domain turardi va yangi paket testlari
    # CI'da umuman ishlamas edi; filtrsiz variant o'sha tuzoqni yopadi.
    - pnpm turbo run test
    # Vercel'da deploy bo'ladigan Next.js app'lari
    - pnpm turbo run build --filter=@ecom/web --filter=@ecom/admin --filter=@ecom/seller --filter=@ecom/roadmap

# Migratsiyani production bazasiga qollash.
#
# ATAYLAB QOLDA (when: manual): hozir alohida staging bazasi yoq, shuning uchun
# har main push'da avtomatik migratsiya qilish xavfli. Staging paydo bolgach
# avtomatlashtirish mumkin.
#
# allow_failure: true — job HAR DOIM qo'lda qoladi, lekin pipeline uni KUTMAYDI.
# Usiz main'dagi har bir pipeline "blocked" holatida muzlab qolardi (manual job
# bajarilmagani uchun) va yashil/qizil farqi ko'rinmasdi: haqiqiy yiqilish ham,
# oddiy kutish ham bir xil ko'rinardi. Endi verify o'tsa pipeline "passed" bo'ladi,
# migratsiya tugmasi esa o'sha joyda turaveradi.
#
# TALAB: GitLab > Settings > CI/CD > Variables da DATABASE_URL qoyilishi kerak
# (masked, protected). Qoyilmasa job yiqiladi - bu ataylab, jim otib ketmasin.
migrate-deploy:
  stage: deploy
  image: node:20-bookworm-slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      # main'ning pipeline'i qo'lda ishga tushadigan job sababli "blocked"
      # holatida muzlab qolmasligi uchun.
      allow_failure: true
  before_script: *node-setup
  script:
    - test -n "$DATABASE_URL" || (echo "DATABASE_URL CI ozgaruvchisi qoyilmagan" && exit 1)
    - pnpm --filter @ecom/database exec prisma migrate status
    - pnpm --filter @ecom/database exec prisma migrate deploy

# Docker image'lar faqat versiya tegida yoki qo'lda (CI/CD > Pipelines > Run pipeline)
# quriladi — har push'da emas, CI daqiqalarini tejash uchun.
# api/wms graveyard'ga karantinlangan (qarang graveyard/README.md) — matritsada yo'q.
docker-build-push:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - APP: [web, admin, seller, telegram-mini-app, telegram-bot]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/ecom-$APP"
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -f "apps/$APP/Dockerfile" -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:latest"

# Flutter ilovalari (apps/flutter) — alohida toolchain, alohida job.
#
# `rules: exists:` — job faqat pubspec paydo bo'lgandan keyin pipeline'ga
# qo'shiladi. Hozircha loyiha skaffold qilinmagan (Flutter o'rnatilishi
# kutilmoqda), shuning uchun bu job hali yaratilmaydi va pipeline'ni
# yiqitmaydi.
#
# `apps/flutter/**` pnpm workspace'dan chiqarilgan, ya'ni yuqoridagi
# `lint-typecheck-build` bu kodga tegmaydi.
flutter-verify:
  stage: verify
  # NEGA `ghcr.io/cirruslabs/flutter:stable` EMAS:
  # u teg nomiga qaramay eskirib qoladi. 2026-10-03 holatida o'sha teg
  # Flutter 3.44.0 / Dart 3.12.0 ni berardi, loyiha esa 3.47.6 (Dart
  # 3.13.5) bilan yoziladi — `pub get` «requires SDK version ^3.13.5»
  # deb yiqilardi va buni teg nomidan bilib bo'lmasdi.
  #
  # Shuning uchun rasmiy arxiv ANIQ versiya bilan olinadi. Versiyani
  # yangilaganda `FLUTTER_VERSION` va ishlab chiquvchi mashinasidagi
  # SDK birga o'zgaradi.
  image: debian:bookworm-slim
  interruptible: true
  variables:
    FLUTTER_VERSION: '3.47.6'
    FLUTTER_ROOT: '$CI_PROJECT_DIR/.flutter-sdk'
  cache:
    key: 'flutter-$FLUTTER_VERSION'
    paths:
      - .flutter-sdk/
  rules:
    - exists:
        - apps/flutter/shared/pubspec.yaml
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils
    - rm -rf /var/lib/apt/lists/*
    - |
      if [ ! -x "$FLUTTER_ROOT/flutter/bin/flutter" ]; then
        mkdir -p "$FLUTTER_ROOT"
        curl -fsSL -o /tmp/flutter.tar.xz           "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        tar -xJf /tmp/flutter.tar.xz -C "$FLUTTER_ROOT"
      fi
    - export PATH="$FLUTTER_ROOT/flutter/bin:$PATH"
    # Flutter o'z katalogini git repo sifatida o'qiydi; CI'da egasi boshqa.
    - git config --global --add safe.directory "$FLUTTER_ROOT/flutter"
    - flutter --version
    # Tarjimalar GENERATSIYA qilinadi va repo'ga kirmaydi (manba —
    # packages/i18n/src/locales/). Bu image'da Node yo'q, shuning uchun
    # `pnpm flutter:i18n` o'rniga o'sha skript bajaradigan nusxa
    # ko'chirish qo'lda takrorlanadi. Nusxasiz `flutter test` yiqiladi:
    # ekranlar asset'dan matn o'qiydi.
    - mkdir -p apps/flutter/shared/assets/i18n
    - cp packages/i18n/src/locales/*.json apps/flutter/shared/assets/i18n/
  script:
    - |
      set -e
      cd apps/flutter
      for d in shared customer courier; do
        [ -f "$d/pubspec.yaml" ] || continue
        echo "=== $d ==="
        (
          cd "$d"
          flutter pub get
          dart analyze
          # Test papkasi bo'lmasa `flutter test` xato beradi — o'tkazib yuboramiz.
          if [ -d test ]; then flutter test; else echo "(test yo'q)"; fi
        )
      done
