# GitLab CI — .github/workflows/ci.yml va docker.yml ekvivalenti.
# Eslatma: sayt Vercel'da deploy bo'ladi, shu sababli bu yerda deploy job yo'q.

stages:
  - verify
  - deploy
  - docker
  - monitor

# GitHub'dagi `on: push [main, develop]` + `on: pull_request` ekvivalenti.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

variables:
  # Prisma client generatsiyasi va Next build vaqtidagi schema validatsiyasi uchun
  # placeholder (CI'da haqiqiy DB'ga ulanilmaydi)
  DATABASE_URL: 'postgresql://user:pass@localhost:5432/db'
  PNPM_STORE: '$CI_PROJECT_DIR/.pnpm-store'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Verify ikkiga BO'LINGAN, chunki `interruptible` job darajasidagi kalit —
# uni `rules` ichida shartga bog'lab bo'lmaydi.
#
# Nega kerak: main'ga ketma-ket bir nechta MR merge qilinsa, GitLab eski
# pipeline'larni BEKOR QILARDI ("Canceled"). Kod baribir tekshirilardi —
# eng oxirgi pipeline hamma merge'ni o'z ichiga oladi — lekin ro'yxatda
# uchta "Canceled" yozuvi qolardi va u yiqilishdan farq qilmasdi. Pipeline
# holati shu tariqa ishonchini yo'qotadi.
#
# Endi: MR pipeline'lari bekor qilinaveradi (u yerda foydali — yangi push
# eskisini almashtiradi), main/develop esa oxirigacha ishlaydi va har bir
# merge commit o'z yashil natijasini oladi.
.verify-base:
  stage: verify
  image: node:20-bookworm-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.9 --activate
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  script:
    # Prisma client typecheck va build uchun kerak (DB'ga ulanmaydi)
    - pnpm db:generate
    - pnpm lint
    - pnpm typecheck
    # Unit-testlar — `test` skripti bor HAR BIR paket.
    # Ilgari bu yerda faqat @ecom/core-domain turardi va yangi paket testlari
    # CI'da umuman ishlamas edi; filtrsiz variant o'sha tuzoqni yopadi.
    - pnpm turbo run test
    # Vercel'da deploy bo'ladigan Next.js app'lari
    - pnpm turbo run build --filter=@ecom/web --filter=@ecom/admin --filter=@ecom/seller --filter=@ecom/roadmap

# MR pipeline — yangi push eskisini almashtiradi (CI daqiqalarini tejaydi)
verify:mr:
  extends: .verify-base
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# main/develop — HECH QACHON bekor qilinmaydi: har merge commit tekshirilsin
verify:main:
  extends: .verify-base
  interruptible: false
  rules:
    # Jadval pipeline'i faqat route-health uchun — bu yerda build shart emas
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"

# Migratsiyani production bazasiga qollash.
#
# ATAYLAB QOLDA (when: manual): hozir alohida staging bazasi yoq, shuning uchun
# har main push'da avtomatik migratsiya qilish xavfli. Staging paydo bolgach
# avtomatlashtirish mumkin.
#
# allow_failure: true — job HAR DOIM qo'lda qoladi, lekin pipeline uni KUTMAYDI.
# Usiz main'dagi har bir pipeline "blocked" holatida muzlab qolardi (manual job
# bajarilmagani uchun) va yashil/qizil farqi ko'rinmasdi: haqiqiy yiqilish ham,
# oddiy kutish ham bir xil ko'rinardi. Endi verify o'tsa pipeline "passed" bo'ladi,
# migratsiya tugmasi esa o'sha joyda turaveradi.
#
# TALAB: GitLab > Settings > CI/CD > Variables da DATABASE_URL qoyilishi kerak
# (masked, protected). Qoyilmasa job yiqiladi - bu ataylab, jim otib ketmasin.
migrate-deploy:
  stage: deploy
  image: node:20-bookworm-slim
  rules:
    # Jadval pipeline'i faqat route-health uchun — bu yerda build shart emas
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.9 --activate
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  script:
    - test -n "$DATABASE_URL" || (echo "DATABASE_URL CI ozgaruvchisi qoyilmagan" && exit 1)
    - pnpm --filter @ecom/database exec prisma migrate status
    - pnpm --filter @ecom/database exec prisma migrate deploy

# Docker image'lar faqat versiya tegida yoki qo'lda (CI/CD > Pipelines > Run pipeline)
# quriladi — har push'da emas, CI daqiqalarini tejash uchun.
# api/wms graveyard'ga karantinlangan (qarang graveyard/README.md) — matritsada yo'q.
docker-build-push:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - APP: [web, admin, seller, telegram-mini-app, telegram-bot]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/ecom-$APP"
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -f "apps/$APP/Dockerfile" -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:latest"

# Production marshrutlarini bosib chiqadi va siniganini topadi.
#
# NEGA: /uz/download production'da 90 soniya osilib turib 500 qaytarardi va
# buni hech kim sezmagan. Sentry ulangan, lekin RSC oqimi o'rtasida uzilgan
# xato u yerga tushmadi. Bu job aynan shunday jim nosozliklarni tutadi.
#
# HAR PUSH'DA EMAS, faqat jadval bo'yicha (CI/CD > Schedules) yoki qo'lda.
# Sabab: push paytida production'da hali ESKI kod turadi — repodagi marshrut
# ro'yxati bilan mos kelmay, soxta ogohlantirish berardi.
#
# Sozlash: GitLab > CI/CD > Schedules > New schedule (masalan har kuni 09:00).
# SITE_URL o'zgaruvchisi qo'yilmasa production manzili ishlatiladi.
route-health:
  stage: monitor
  image: node:20-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.9 --activate
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  script:
    - npx tsx scripts/route-health.ts "${SITE_URL:-https://sellobay-web.vercel.app}"
