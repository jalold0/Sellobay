# Flutter shabloni bu yerga `-Xmx8G -XX:MaxMetaspaceSize=4G` yozadi. Bu
# ishlab chiqish mashinasida 7.3 GB RAM bo'lsa, JVM mavjud xotiradan
# ko'proq heap so'ragan bo'ladi va AAPT2 resurslarni kompilyatsiya
# qilayotganda Windows "Insufficient system resources" (1450) bilan
# yiqiladi. Xato TASODIFIY ko'rinadi: qaysi resurs faylida uzilishi har
# safar boshqacha, shuning uchun kod xatosiga o'xshab tuyuladi.
#
# 3 GB bu loyiha uchun yetarli (eng katta modul — shared_preferences
# ning lokalizatsiya resurslari). Kattaroq xotirali mashinada ham
# sekinlashtirmaydi: Gradle heap'ni kerak bo'lgancha oladi, chegara
# faqat yuqoridan cheklaydi.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
