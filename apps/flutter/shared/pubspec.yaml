name: sellobay_shared
description: 'Sellobay mijoz va kuryer ilovalari uchun umumiy kod: API klient, config, i18n.'
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.5
  flutter: '>=1.17.0'

dependencies:
  decimal: ^3.2.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # GENERATSIYA: `pnpm flutter:i18n` (repo root'dan).
  # Manba — packages/i18n/src/locales/. Bu yerdagi nusxalarni tahrirlamang.
  assets:
    - assets/i18n/

  # Brend shriftlari — google/fonts repozitoriyasidagi rasmiy OFL fayllar
  # (ofl/inter, ofl/playfairdisplay; litsenziya: assets/fonts/OFL-*.txt).
  #
  # Ikkalasi ham VARIABLE shrift: bitta fayl barcha og'irliklarni beradi
  # va Flutter `FontWeight` ni `wght` o'qiga o'zi qo'llaydi — har
  # og'irlik uchun alohida statik fayl kerak emas.
  #
  # Paketdagi shrift ilovada `packages/sellobay_shared/<oila>` nomi bilan
  # ko'rinadi — `SellobayType.sans`/`serif` aynan shu nomni beradi.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
