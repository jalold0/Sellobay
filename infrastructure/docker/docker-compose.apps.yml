# Apps uchun (lokal Docker-da to'liq stack ko'tarish)
# Foydalanish: docker compose -f docker-compose.yml -f docker-compose.apps.yml up
#
# ESLATMA (2026-07-17): `api` (NestJS) va `wms` xizmatlari graveyard/ ga ko'chirildi —
# haqiqiy backend `apps/web`. Ular ishlatilmagani uchun bu compose'dan olib tashlandi.
name: ecommerce-apps

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'

  telegram-bot:
    build:
      context: ../..
      dockerfile: apps/telegram-bot/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - web
